[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "um982py"
version = "1.0.0"
description = "Unicore UM982 GNSS library"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["gnss", "gps", "um982py", "unicore", "nmea", "rtcm", "rinex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
  "types-pyserial",
]

[project.scripts]
um982py = "um982py.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/um982py"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/R1.15.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "C4", "PIE", "PERF",
  "PTH", "RET",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"examples/**" = ["S101", "T201"]
"tests/test_reference.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src/um982py", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["hardware: requires an explicitly selected receiver port"]

[tool.coverage.run]
source = ["um982py"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
