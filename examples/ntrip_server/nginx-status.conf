proxy_cache_path /var/cache/nginx/ntrip-status levels=1:2 keys_zone=ntrip_status:8m max_size=64m inactive=1d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=ntrip_status_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ntrip_status_connections:10m;

server {
    listen 443 ssl;
    server_name status.example.org;

    ssl_certificate /etc/ntrip-status/fullchain.pem;
    ssl_certificate_key /etc/ntrip-status/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1k;
    client_header_timeout 3s;
    client_body_timeout 3s;
    send_timeout 5s;
    keepalive_timeout 10s;
    limit_req zone=ntrip_status_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn ntrip_status_connections 20;

    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host status.example.org;
        proxy_set_header Connection close;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_buffering on;
        proxy_cache ntrip_status;
        proxy_cache_key "ntrip-status:$uri$is_args$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale off;
    }
}
